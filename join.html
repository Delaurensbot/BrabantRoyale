<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Recent clan joins</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #eef2ff;
      --muted: rgba(238, 242, 255, 0.76);
      --card: rgba(22, 26, 40, 0.9);
      --card-border: rgba(177, 92, 255, 0.28);
      --purple: #b15cff;
      --green: #74ff8d;
    }
    body { font-family: system-ui, Arial; max-width: 1100px; margin: 28px auto; padding: 0 16px; color: var(--text); background: radial-gradient(circle at 22% 16%, rgba(177, 92, 255, 0.3), transparent 36%), radial-gradient(circle at 76% 0%, rgba(116, 255, 141, 0.24), transparent 28%), linear-gradient(165deg, #141829, #0c0e16); }
    h1 { margin: 0 0 10px; }
    .top { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .muted { color: var(--muted); }
    .clanSwitch { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .clanButton { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--card-border); background: rgba(20, 24, 36, 0.9); cursor: pointer; color: inherit; }
    .clanButton--active { border-color: var(--green); box-shadow: 0 0 0 1px rgba(116, 255, 141, 0.4), 0 10px 24px rgba(0,0,0,0.36); }
    a { color: #bfffc8; }
    button { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--card-border); background: linear-gradient(145deg, rgba(177, 92, 255, 0.22), rgba(116, 255, 141, 0.08)); color: inherit; cursor: pointer; box-shadow: 0 8px 18px rgba(0,0,0,0.25); }
    button:hover { border-color: rgba(116, 255, 141, 0.85); background: linear-gradient(145deg, rgba(177, 92, 255, 0.34), rgba(116, 255, 141, 0.18)); }
    .card { border-radius: 16px; padding: 14px; background: var(--card); border: 1px solid var(--card-border); box-shadow: 0 20px 60px rgba(0,0,0,0.28); margin-bottom: 18px; }
    .cardHead { display:flex; justify-content: space-between; align-items:center; margin-bottom: 10px; gap: 10px; }
    .title { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
    .filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .filters input { padding: 9px 10px; border-radius: 10px; border: 1px solid rgba(177, 92, 255, 0.4); background: rgba(12, 16, 27, 0.85); color: inherit; min-width: 180px; }
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: left; padding: 10px 12px; background: linear-gradient(135deg, rgba(177, 92, 255, 0.35), rgba(116, 255, 141, 0.2)); border-bottom: 1px solid rgba(177, 92, 255, 0.35); font-weight: 700; font-size: 14px; letter-spacing: 0.1px; }
    tbody td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px; }
    tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,0.08); font-size: 12px; margin-left: 6px; }
    .status { margin-left: 4px; }
    .error { margin: 12px 0; padding: 12px 14px; border-radius: 12px; background: rgba(255,0,0,0.12); border: 1px solid rgba(255,0,0,0.25); display:none; }
    .pill { display: inline-block; padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,0.08); font-size: 12px; }
    .playerBtn { background:none; border:none; color:#bfffc8; padding:0; margin:0; box-shadow:none; text-decoration:underline; cursor:pointer; font:inherit; }
    .detailsBox { margin-top: 12px; padding: 12px; border-radius: 12px; border: 1px solid rgba(116,255,141,0.35); background: rgba(116,255,141,0.08); display:none; }
  </style>
</head>
<body>
  <div class="top">
    <h1 style="margin-right: 10px;">Recente clan joins</h1>
    <a class="muted" id="dashboardLink" href="/index.html">← Terug naar dashboard</a>
  </div>
  <div class="muted">Laatste refresh: <span id="updated">-</span></div>
  <div class="clanSwitch" id="clanSwitch"></div>
  <div class="muted" id="clanLabel"></div>
  <div class="muted" id="trackerNote">Join history now uses official API member snapshots. New joins appear after they are observed.</div>
  <div class="top" style="margin-top: 10px;">
    <button id="refresh">Refresh</button>
    <div class="muted status" id="status"></div>
  </div>
  <div class="error" id="errorBox"></div>

  <div class="card">
    <div class="cardHead">
      <div class="title">Laatste joins</div>
      <div class="muted" id="countLabel"></div>
    </div>
    <div class="filters">
      <input id="search" type="search" placeholder="Filter op naam of tag..." />
    </div>
    <div class="tableWrap">
      <table id="joinTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Speler</th>
            <th>Player ID</th>
            <th>Gejoind</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="joinRows">
          <tr><td colspan="5" style="text-align:center; padding: 16px;">(laden...)</td></tr>
        </tbody>
      </table>
    </div>
    <div class="detailsBox" id="playerDetails"></div>
  </div>

  <script>
    const el = (id) => document.getElementById(id);
    const CLANS = {
      "9YP8UY": { name: "Brabant Royale" },
      "GPCLVLPP": { name: "Brabant Royale 2" },
    };
    const DEFAULT_CLAN = "9YP8UY";
    let currentClanTag = DEFAULT_CLAN;
    let joinData = [];

    function normalizeClanTag(tag) {
      return (tag || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    }

    function clanName(tag) {
      return (CLANS[tag] && CLANS[tag].name) || CLANS[DEFAULT_CLAN].name;
    }

    function updateClanLabel() {
      const label = el("clanLabel");
      if (label) {
        label.textContent = `Joins voor ${clanName(currentClanTag)} (${currentClanTag})`;
      }
    }

    function updateNavLinks() {
      const query = `?clan=${encodeURIComponent(currentClanTag)}`;
      const dashboardLink = el("dashboardLink");
      if (dashboardLink) dashboardLink.href = `/index.html${query}`;
    }

    function renderClanButtons() {
      const switchEl = el("clanSwitch");
      if (!switchEl) return;
      switchEl.innerHTML = "";

      Object.entries(CLANS).forEach(([tag, info]) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "clanButton";
        btn.dataset.clan = tag;
        btn.textContent = `${info.name} (${tag})`;
        btn.addEventListener("click", () => setClan(tag));
        switchEl.appendChild(btn);
      });
    }

    function setClan(tag, skipFetch = false) {
      const normalized = normalizeClanTag(tag);
      currentClanTag = CLANS[normalized] ? normalized : DEFAULT_CLAN;

      document.querySelectorAll(".clanButton").forEach((btn) => {
        if (btn.dataset.clan === currentClanTag) {
          btn.classList.add("clanButton--active");
        } else {
          btn.classList.remove("clanButton--active");
        }
      });

      updateClanLabel();
      updateNavLinks();
      if (!skipFetch) {
        fetchData();
      }
    }

    function renderTable() {
      const tbody = el("joinRows");
      const search = (el("search").value || "").toLowerCase();

      const filtered = joinData.filter((row) => {
        const haystack = `${row.name} ${row.pid}`.toLowerCase();
        return !search || haystack.includes(search);
      });

      tbody.innerHTML = "";

      if (!filtered.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 5;
        td.style.textAlign = "center";
        td.style.padding = "16px";
        td.textContent = "Geen resultaten";
        tr.appendChild(td);
        tbody.appendChild(tr);
        el("countLabel").textContent = "0 resultaten";
        return;
      }

      filtered.forEach((row, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td><button class="playerBtn" data-pid="${row.pid}">${row.name}</button></td>
          <td><span class="pill">${row.pid}</span></td>
          <td>${row.ago}</td>
          <td><button class="playerBtn" data-pid="${row.pid}">Bekijk</button></td>
        `;
        tbody.appendChild(tr);
      });

      tbody.querySelectorAll('.playerBtn').forEach((btn) => {
        btn.addEventListener('click', () => showPlayerDetails(btn.dataset.pid));
      });

      el("countLabel").textContent = `${filtered.length} resultaten`;
    }

    async function showPlayerDetails(pid) {
      const box = el("playerDetails");
      box.style.display = "block";
      box.textContent = `Laden speler ${pid}...`;

      try {
        const res = await fetch(`/api/player_summary?pid=${encodeURIComponent(pid)}&clan=${encodeURIComponent(currentClanTag)}&t=${Date.now()}`, { cache: "no-store" });
        const data = await res.json().catch(() => ({}));

        if (!res.ok || !data.ok || !data.player) {
          const apiError = data.error || `API fout (${res.status})`;
          box.textContent = `Kon spelerdetails niet ophalen: ${apiError}`;
          return;
        }

        const p = data.player;
        const warRows = (p.war_history || []).slice().reverse()
          .map((row) => `<tr><td>${row.week}</td><td>${row.contribution}</td><td>${row.decks_used}</td></tr>`)
          .join("");

        const warTable = warRows
          ? `<div style="margin-top:10px;"><strong>War geschiedenis (zichtbaar na klik)</strong><table style="margin-top:8px;"><thead><tr><th>Weekend</th><th>Fame/Contribution</th><th>Decks used</th></tr></thead><tbody>${warRows}</tbody></table></div>`
          : `<div style="margin-top:10px;" class="muted">Geen war weekends gevonden voor deze speler binnen clan ${p.clan_tag || currentClanTag}.</div>`;

        box.innerHTML = `
          <strong>${pid}</strong><br>
          Account level: <strong>${p.acc_lvl || "-"}</strong><br>
          Total Clan War 2 wins: <strong>${p.cw2_wins || "-"}</strong>
          ${warTable}
        `;
      } catch (error) {
        box.textContent = `Netwerkfout bij spelerdetails: ${error?.message || "onbekend"}`;
      }
    }

    async function fetchData() {
      el("errorBox").style.display = "none";
      el("status").textContent = `Bezig met laden voor ${clanName(currentClanTag)}...`;

      try {
        const res = await fetch(`/api/join_data?clan=${encodeURIComponent(currentClanTag)}&limit=10&t=${Date.now()}`, { cache: "no-store" });
        const data = await res.json().catch(() => ({}));

        if (!res.ok || !data.ok) {
          const apiError = data.error || `API fout (${res.status})`;
          const detailsText = (data.details || "").trim();
          const hasDistinctDetails = detailsText && detailsText !== apiError;
          const details = hasDistinctDetails ? ` Details: ${detailsText}` : "";
          el("status").textContent = "";
          el("errorBox").style.display = "block";
          el("errorBox").textContent = `${apiError}${details}`;
          return;
        }

        joinData = (data.joins || []).slice(0, 10);
        if (data.note) {
          const noteEl = el("trackerNote");
          if (noteEl) noteEl.textContent = data.note;
        }
        el("updated").textContent = new Date().toLocaleString();
        el("countLabel").textContent = `${joinData.length} resultaten`;
        el("status").textContent = "";
        renderTable();
      } catch (error) {
        el("status").textContent = "";
        el("errorBox").style.display = "block";
        el("errorBox").textContent = `Netwerkfout tijdens ophalen joins: ${error?.message || "onbekend"}`;
      }
    }

    el("refresh").addEventListener("click", fetchData);
    el("search").addEventListener("input", renderTable);
    
    function init() {
      renderClanButtons();
      const params = new URLSearchParams(window.location.search);
      const desired = params.get("clan") || DEFAULT_CLAN;
      setClan(desired, true);
      fetchData().catch(() => {});
    }

    init();
  </script>
</body>
</html>
